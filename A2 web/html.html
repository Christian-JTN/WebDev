<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utang list</title>
    <link rel="stylesheet" href="css/css.css" />
    <script src="js/js.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>LISTAHAN NG MGA NG UTANG</h1>
        <p class="subtitle">mga ng utang sakin</p>
      </header>

      <div class="input-con">
        <div class="form-group">
          <div class="input-group">
            <label for="name">Pangalan nila:</label>
            <input type="text" id="name" placeholder="Pangalan ng nangutang" />
            <div id="nameError" class="error"></div>
          </div>

          <div class="input-group">
            <label for="amount">Magkano hiniram (₱):</label>
            <input
              type="number"
              id="amount"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
            <div id="amountError" class="error"></div>
          </div>
        </div>

        <div class="button-wrapper">
          <button id="saveButton">SAVE</button>
          <button id="clearButton">CLEAR FIELDS</button>
        </div>
      </div>

      <div class="utang-list">
        <h2>MGA NG UTANG</h2>
        <ul id="nakautangs">
          <li class="empty-list" id="emptyList">
            Walang pang ng utang na-record
          </li>
        </ul>
      </div>
    </div>

  </body>
</html>
